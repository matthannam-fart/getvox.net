<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vox — An intercom for your computer</title>
  <link rel="icon" type="image/png" href="vox_logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.75rem;
      display: block;
    }
    .tagline {
      font-size: 1.15rem;
      color: #c0c0d0;
      margin-bottom: 2.25rem;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }
    .btn {
      display: inline-block;
      padding: 14px 36px;
      width: 240px;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .btn-primary {
      background: #00b894;
      color: #fff;
      border: 1px solid #00b894;
    }
    .btn-primary:hover { background: #00a381; border-color: #00a381; }
    .btn-secondary {
      background: transparent;
      color: #c0c0d0;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .btn-secondary:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.4);
    }
    .platform-hint {
      font-size: 0.8rem;
      color: #6a6a8a;
      margin-top: 0.9rem;
    }
    /* On phones, hide the desktop download — it's irrelevant */
    @media (max-width: 600px) {
      .desktop-only { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="vox_logo.png" alt="Vox">
    <p class="tagline">Welcome to Vox, an intercom for your computer</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://app.getvox.net">Open Web App</a>
      <a class="btn btn-secondary desktop-only" href="https://github.com/matthannam-fart/vox/releases/latest/download/Vox.zip">Download Desktop</a>
      <p class="platform-hint desktop-only">Desktop app · Mac &amp; Windows</p>
    </div>
  </div>
</body>
</html>
